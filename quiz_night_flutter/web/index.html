<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    $FLUTTER_BASE_HREF is replaced by the `--base-href` argument of
    `flutter build`. It must start and end with a slash.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Live elimination quiz: survive the round, or go home.">
  <meta name="theme-color" content="#14123A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Quiz Night">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Quiz Night</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Shown instantly while Flutter downloads (~3 MB on first visit, mostly the
    rendering engine). Plain HTML and CSS only, so it costs almost nothing.
    flutter_bootstrap.js removes it once the app has painted.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #14123A; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      color: #F4F2FF; font: 600 16px/1.4 system-ui, -apple-system, sans-serif;
      transition: opacity 250ms ease;
    }
    #loading h1 {
      margin: 0; font-size: 40px; font-weight: 900; letter-spacing: -1px;
    }
    #loading p { margin: 0; color: #A9A4D6; }
    #loading .spinner {
      width: 44px; height: 44px; border-radius: 50%;
      border: 5px solid #2E2A6B; border-top-color: #FFC233;
      animation: spin 0.9s linear infinite;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #loading .spinner { animation-duration: 3s; }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <h1>Quiz Night</h1>
    <div class="spinner" aria-hidden="true"></div>
    <p>Loading the stage…</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
