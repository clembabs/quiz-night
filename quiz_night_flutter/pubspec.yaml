name: quiz_night_flutter
description: Quiz Night web app (host, player and spectator screens).

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.12.2'
  flutter: '^3.44.4'

resolution: workspace

dependencies:
  cupertino_icons: ^1.0.5
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.1.1
  qr_flutter: ^4.1.0
  quiz_night_client:
    path: ../quiz_night_client
  serverpod_auth_idp_flutter: 4.0.4
  serverpod_flutter: 4.0.4
  shared_preferences: ^2.5.6
  web: ^1.1.2

dev_dependencies:
  bloc_test: ^10.0.0
  fake_async: ^1.3.3
  # Lets agents drive the app through the Dart MCP (lib/driver.dart).
  flutter_driver:
    sdk: flutter
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

dependency_overrides:
  flutter_secure_storage: ^10.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/config.json
    - assets/fonts/licenses/

  # Bundled, subset fonts (see tool/make_fonts.py). Display: Bricolage
  # Grotesque 800; body: Figtree. NotoSansAfr is a tiny per-glyph fallback for
  # Nigerian letters the other two lack (ẹ ọ ṣ ị ụ ṅ ɓ ɗ ƙ ƴ).
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
        - asset: assets/fonts/Figtree-ExtraBold.ttf
          weight: 800
    - family: NotoSansAfr
      fonts:
        - asset: assets/fonts/NotoSansAfr-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansAfr-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansAfr-ExtraBold.ttf
          weight: 800
    # ✓ ✕ ▲ ▼ ★ ⏱ only (3 KB), for UI symbols no text font has.
    - family: NotoSansSymbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols-Regular.ttf

