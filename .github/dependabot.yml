# Weekly pull requests for security fixes and new versions, into develop so
# they go through CI and the normal release to main.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  # The root pubspec is a workspace holding the server, client and app.
  - package-ecosystem: pub
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
    ignore:
      # Serverpod packages move together with the CLI and generated code;
      # upgrade them deliberately (make generate, migrations), not one by one.
      - dependency-name: 'serverpod*'
