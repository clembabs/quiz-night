### Snapshot pushed to every client in a room.
class: RoomState
fields:
  code: String
  status: RoomStatus
  round: int
  questionsPerRound: int
  finalistTarget: int
  finalQuestionCount: int
  finalQuestionsPlayed: int
  eliminationRule: EliminationRule
  wildcardUsed: bool
  ### Host has closed the room to new players.
  locked: bool, default=false
  ### When the 30-minute game ends (server clock); null if not running.
  sessionEndsAt: DateTime?
  ### Why the game ended, once it has.
  endReason: RoomEndReason?
  question: QuestionView?
  questionEndsAt: DateTime?
  serverTime: DateTime
  players: List<PlayerView>
  lastElimination: EliminationEvent?
  buzzerHolderId: int?
  ### Finalist who answered the current final question correctly, if any.
  buzzWinnerId: int?
  ### Whether phones show the question text (host setting).
  showQuestionOnPhones: bool, default=true
  ### Remote game: phones run the reveals and the cut themselves.
  remote: bool, default=false
  ### Danger line: survivors if the round ended now; null with no round cut.
  projectedSurvivors: int?
