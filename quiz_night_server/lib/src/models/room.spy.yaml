class: Room
table: room
fields:
  code: String
  hostToken: String?, scope=serverOnly
  status: RoomStatus, default=lobby
  currentRound: int, default=0
  ### Question index within the round (1-based; 0 = none yet).
  currentQuestionIndex: int, default=0
  currentQuestionId: int?
  questionsPerRound: int
  eliminationRule: EliminationRule
  eliminationPercent: double
  finalistTarget: int
  roundsBeforeFinal: int
  tiebreakMode: TiebreakMode
  finalQuestionCount: int
  timeLimitSeconds: int
  showQuestionOnPhones: bool, default=true
  ### Players join from wherever they are; phones show the whole game.
  remote: bool, default=false
  wildcardUsed: bool, default=false
  ### Host has closed the room to new players.
  locked: bool, default=false
  startingPlayerCount: int?
  questionStartedAt: DateTime?
  questionEndsAt: DateTime?
  ### Last round whose cut has been applied; makes endRound idempotent.
  lastCutRound: int, default=0
  finalQuestionsPlayed: int, default=0
  buzzerHolderId: int?
  lastElimination: EliminationEvent?
  createdAt: DateTime, default=now
  ### When the host started the game; the 30-minute game clock runs from here.
  startedAt: DateTime?
  ### Last change (join, answer, host action); rooms idle 30 minutes close.
  lastActivityAt: DateTime, default=now
  ### Set when the game ends.
  endReason: RoomEndReason?
  ### AI-written questions played before the built-in bank.
  packId: int?, relation(parent=question_pack, onDelete=SetNull)
indexes:
  room_code_idx:
    fields: code
    unique: true
