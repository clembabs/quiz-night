services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: quiz_night
      POSTGRES_PASSWORD: "${POSTGRES_DEV_PASSWORD}"
    volumes:
      - quiz_night_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass ${REDIS_DEV_PASSWORD}
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: quiz_night_test
      POSTGRES_PASSWORD: "${POSTGRES_TEST_PASSWORD}"
    volumes:
      - quiz_night_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass ${REDIS_TEST_PASSWORD}
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  quiz_night_data:
  quiz_night_test_data:
