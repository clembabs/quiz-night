# Template for config/passwords.yaml (which is gitignored). Generate real values; never commit them.
# Use this file to store passwords to services that your server you use. When
# the server starts, the passwords will be automatically loaded and can be
# accessed from the `session.passwords` field. If you don't have access to a
# session object, passwords can also be accessed from
# `Serverpod.instance.passwords`. You can provide different passwords for
# different run configurations. If you want the same password for any
# configuration used, place it under `shared`.
#
# Note that this file should not be under version control. Store it in a safe
# place.

# Save passwords used across all configurations here.
# shared:
#   # Example custom secret. Uncomment and rename to store a value shared
#   # across all run modes. Access via `pod.getPassword('mySharedPassword')`.
#   mySharedPassword: 'change-me'

# These are passwords used when running the server locally in development mode
development:
  database: 'change-me'
  redis: 'change-me'

  # Optional: a Google AI Studio key turns on AI-written questions and host
  # lines. Without it the game uses the built-in questions and lines.
  # geminiApiKey: 'your-key'

  # The service secret is used to communicate between servers and to access the
  # service protocol.
  serviceSecret: 'change-me'

  emailSecretHashPepper: 'change-me'
  jwtHmacSha512PrivateKey: 'change-me'
  jwtRefreshTokenHashPepper: 'change-me'
  # Random value to be used as a pepper for the server-side sessions hash.
  # Only required if using `ServerSideSessionsConfigFromPasswords()` as token
  # manager on `tokenManagerBuilders` in lib/server.dart. Safe to remove from
  # the run modes that won't use it.
  # serverSideSessionKeyHashPepper: 'change-me'

test:
  database: 'change-me'
  redis: 'change-me'

  emailSecretHashPepper: 'change-me'
  jwtHmacSha512PrivateKey: 'change-me'
  jwtRefreshTokenHashPepper: 'change-me'
  # serverSideSessionKeyHashPepper: 'change-me'

# Passwords used in your staging environment if you use one. The default setup
# use a password for Redis.
staging:
  database: 'change-me'
  serviceSecret: 'change-me'

  emailSecretHashPepper: 'change-me'
  jwtHmacSha512PrivateKey: 'change-me'
  jwtRefreshTokenHashPepper: 'change-me'
  # serverSideSessionKeyHashPepper: 'change-me'

# Passwords used in production mode.
production:
  database: 'change-me'
  serviceSecret: 'change-me'

  emailSecretHashPepper: 'change-me'
  jwtHmacSha512PrivateKey: 'change-me'
  jwtRefreshTokenHashPepper: 'change-me'
  # serverSideSessionKeyHashPepper: 'change-me'
