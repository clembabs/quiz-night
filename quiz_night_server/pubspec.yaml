name: quiz_night_server
description: Quiz Night server (rooms, cuts, the buzzer final, AI questions).

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  serverpod: 4.0.4
  serverpod_auth_idp_server: 4.0.4
  serverpod_cloud_storage: 4.0.4

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 4.0.4
  test: ^1.31.1

serverpod:
  scripts:
    # Build the Flutter web app and copy it to the server's web directory.
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    # On failure, clean and retry once to clear stale Flutter build caches.
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app)
        & cd /D ..\quiz_night_flutter
        & set ARGS=web --base-href /
        && (call flutter build %ARGS% || (flutter clean && call flutter build %ARGS%))
        && xcopy /E /I /Y build\web ..\quiz_night_server\web\app
      posix: |
        rm -rf ../quiz_night_server/web/app
        cd ../quiz_night_flutter
        set -- web --base-href / --output ../quiz_night_server/web/app
        flutter build "$@" || { flutter clean && flutter build "$@"; }

  # The app `serverpod start` launches alongside the server (Ctrl+R).
  flutter_apps:
    quiz_night:
      path: ../quiz_night_flutter
      displayName: "Quiz night app"
      auto_launch: true
      target: lib/driver.dart
